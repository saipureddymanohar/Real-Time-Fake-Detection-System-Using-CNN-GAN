version: '3.8'

services:
  deepfake-detection:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepfake-detection-prod
    ports:
      - "5000:5000"
    volumes:
      - uploads_volume:/app/uploads
      - static_volume:/app/static
      - models_volume:/app/models
    environment:
      - FLASK_ENV=production
      - FLASK_APP=appv2.py
      - PYTHONUNBUFFERED=1
      - MAX_CONTENT_LENGTH=524288000
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - deepfake-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  deepfake-network:
    driver: bridge

volumes:
  uploads_volume:
  static_volume:
  models_volume:
